name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Recherche d'un ZIP
      # --------------------------------------------------
      - name: Detect ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -n "$ZIP" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$ZIP" >> "$GITHUB_OUTPUT"
            echo "ZIP détecté : $ZIP"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Aucun ZIP détecté."
          fi

      # --------------------------------------------------
      # Décompression
      # --------------------------------------------------
      - name: Extract ZIP
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          ZIP="${{ steps.zip.outputs.file }}"

          echo "Décompression de $ZIP..."

          unzip -o "$ZIP" -x ".github/workflows/build.yml"

          echo "Correction des permissions..."

          find . \
            -path './.git' -prune -o \
            -exec chmod u+rwX {} +

          echo "Suppression de tous les ZIP..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

      # --------------------------------------------------
      # Commit des fichiers extraits
      # --------------------------------------------------
      - name: Commit extracted files
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "Auto extract ZIP"
            git push
          fi

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # Installation de la clé de signature
      # --------------------------------------------------
      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Keystore installé dans android/app/."

          echo "Vérification du fichier keystore..."
          ls -lh android/app/upload-keystore.jks

          echo "Vérification du keystore..."
          keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore valide."

      # --------------------------------------------------
      # Dépendances
      # --------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      - name: Verify product statistics
        run: dart tool/check_product_stats.dart

      # --------------------------------------------------
      # Build release signé
      # --------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # Publication de l'APK dans les Releases (hors quota des artefacts)
      # --------------------------------------------------
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" gestioncompta.apk
          TAG="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" gestioncompta.apk \\
            --target "$(git rev-parse HEAD)" \\
            --title "GestionCompta - APK #${GITHUB_RUN_NUMBER}" \\
            --notes "APK Android signé, compilé et vérifié automatiquement." \\
            --latest
          RELEASE_URL="$(gh release view "$TAG" --json url --jq '.url')"
          printf '### APK disponible\\n\\n[Télécharger gestioncompta.apk](%s)\\n' \\
            "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # Suppression de la clé
      # --------------------------------------------------
      - name: Cleanup signing files
        if: always()
        shell: bash
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
