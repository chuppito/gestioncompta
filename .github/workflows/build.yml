name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Recherche d'un ZIP à la racine
      # --------------------------------------------------
      - name: Detect ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -n "$ZIP" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$ZIP" >> "$GITHUB_OUTPUT"
            echo "ZIP détecté : $ZIP"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Aucun ZIP détecté."
          fi

      # --------------------------------------------------
      # Décompression
      # Le build.yml du ZIP est volontairement ignoré
      # --------------------------------------------------
      - name: Extract ZIP
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          ZIP="${{ steps.zip.outputs.file }}"

          echo "Décompression de $ZIP..."

          unzip -o "$ZIP" -x ".github/workflows/build.yml"

          echo "Correction des permissions..."

          find . \
            -path './.git' -prune -o \
            -exec chmod u+rwX {} +

          echo "Suppression de tous les ZIP..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

      # --------------------------------------------------
      # Commit et push des fichiers extraits
      # --------------------------------------------------
      - name: Commit extracted files
        if: steps.zip.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
          else
            git commit -m "Auto extract ZIP"
            git push
          fi

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Flutter
      # --------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------
      # Dépendances
      # --------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------
      - name: Build release APK
        run: flutter build apk --release

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gestioncompta-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
