name: gestioncompta
description: Application de gestion de comptabilité (recettes/dépenses + ventes).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de données locale
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Compte utilisateur + synchronisation cloud
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Récupération de la carte
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Utilitaires
  table_calendar: ^3.1.2
  uuid: ^4.4.0
  intl: ^0.20.2
  share_plus: ^10.1.3
  file_picker: ^9.0.0
  path_provider: ^2.1.0

  # Import du rapport de caisse PayPal (.xlsx)
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Outil pour renommer le package Android/iOS après flutter create
  change_app_package_name: ^1.5.0

  # Génération des icônes launcher Android/iOS
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FF9800"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true